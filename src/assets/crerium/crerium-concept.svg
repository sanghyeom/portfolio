<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Crerium vivarium brand site concept</title>
  <desc id="desc">A hand-drawn concept illustration of a vivarium and crested gecko brand website hero, used as a stand-in for a real screenshot.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11271a"/>
      <stop offset="0.38" stop-color="#1d3c25"/>
      <stop offset="0.52" stop-color="#9fae8c"/>
      <stop offset="0.64" stop-color="#dfe3d2"/>
      <stop offset="1" stop-color="#eef0e6"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0C10 -42 46 -42 56 0C46 42 10 42 0 0Z" fill="currentColor"/>
      <path d="M28 -34C28 -10 28 10 28 34" stroke="rgba(8,18,10,0.35)" stroke-width="2" fill="none"/>
    </g>
    <style>
      .serif{font-family:Georgia,'Noto Serif KR',serif}
      .mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace}
      .sans{font-family:'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- scattered leaf canopy, parted around the terrarium -->
  <g>
    <use href="#leaf" transform="translate(80,90) rotate(-20) scale(1.6)" color="#14281a" opacity=".9"/>
    <use href="#leaf" transform="translate(220,60) rotate(10) scale(1.3)" color="#2d5a37" opacity=".85"/>
    <use href="#leaf" transform="translate(40,280) rotate(15) scale(1.4)" color="#3c6b42" opacity=".75"/>
    <use href="#leaf" transform="translate(300,300) rotate(-10) scale(1.2)" color="#234a2c" opacity=".8"/>
    <use href="#leaf" transform="translate(150,430) rotate(25) scale(1.5)" color="#2d5a37" opacity=".65"/>
    <use href="#leaf" transform="translate(1500,100) rotate(200) scale(1.6)" color="#14281a" opacity=".9"/>
    <use href="#leaf" transform="translate(1380,70) rotate(-160) scale(1.3)" color="#2d5a37" opacity=".85"/>
    <use href="#leaf" transform="translate(1220,150) rotate(150) scale(1.7)" color="#1a3620" opacity=".8"/>
    <use href="#leaf" transform="translate(1540,320) rotate(-140) scale(1.4)" color="#3c6b42" opacity=".7"/>
    <use href="#leaf" transform="translate(1300,380) rotate(170) scale(1.2)" color="#234a2c" opacity=".75"/>
    <use href="#leaf" transform="translate(1430,480) rotate(-120) scale(1.5)" color="#2d5a37" opacity=".6"/>
    <use href="#leaf" transform="translate(60,560) rotate(-5) scale(1.3)" color="#3c6b42" opacity=".5"/>
    <use href="#leaf" transform="translate(1480,590) rotate(110) scale(1.3)" color="#2d5a37" opacity=".45"/>
    <use href="#leaf" transform="translate(760,60) rotate(0) scale(1.0)" color="#14281a" opacity=".65"/>
  </g>

  <!-- terrarium -->
  <g>
    <rect x="560" y="250" width="480" height="440" rx="28" fill="rgba(248,249,243,0.9)" stroke="#17301f" stroke-width="3"/>
    <ellipse cx="650" cy="300" rx="140" ry="60" fill="#ffffff" opacity=".2" transform="rotate(-18 650 300)"/>

    <path d="M560 606Q800 548 1040 606L1040 690L560 690Z" fill="#6b4a33" opacity=".9"/>
    <ellipse cx="650" cy="608" rx="50" ry="17" fill="#5e7a3a" opacity=".85"/>
    <ellipse cx="825" cy="622" rx="68" ry="19" fill="#5e7a3a" opacity=".8"/>
    <ellipse cx="965" cy="600" rx="44" ry="15" fill="#5e7a3a" opacity=".85"/>

    <path d="M600 560C700 480 820 520 980 440" stroke="#6b4a33" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M820 505C850 470 880 460 902 430" stroke="#6b4a33" stroke-width="8" stroke-linecap="round" fill="none"/>

    <use href="#leaf" transform="translate(600,650) rotate(-30) scale(.55)" color="#5e7a3a" opacity=".85"/>
    <use href="#leaf" transform="translate(980,660) rotate(20) scale(.6)" color="#3c6b42" opacity=".85"/>

    <!-- crested gecko on the branch -->
    <g transform="translate(790,472) rotate(-6)">
      <path d="M30 10Q55 22 85 8Q100 0 108 -14Q100 -18 85 -10Q60 2 34 -6Z" fill="#e7d9b8" stroke="#3f2f22" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="-18" cy="16" rx="11" ry="5.5" fill="#e7d9b8" stroke="#3f2f22" stroke-width="1.5" transform="rotate(40 -18 16)"/>
      <ellipse cx="24" cy="16" rx="11" ry="5.5" fill="#e7d9b8" stroke="#3f2f22" stroke-width="1.5" transform="rotate(-40 24 16)"/>
      <g fill="#3f2f22">
        <circle cx="-27" cy="23" r="1.6"/><circle cx="-23" cy="26" r="1.6"/><circle cx="-18" cy="27" r="1.6"/>
        <circle cx="32" cy="23" r="1.6"/><circle cx="28" cy="26" r="1.6"/><circle cx="23" cy="27" r="1.6"/>
      </g>
      <ellipse cx="-38" cy="-2" rx="16" ry="15" fill="#e7d9b8"/>
      <ellipse cx="0" cy="0" rx="42" ry="19" fill="#e7d9b8" stroke="#3f2f22" stroke-width="2"/>
      <ellipse cx="-52" cy="-4" rx="18" ry="15" fill="#e7d9b8" stroke="#3f2f22" stroke-width="2"/>
      <path d="M-66 -18L-60 -25L-55 -18Z" fill="#e7d9b8" stroke="#3f2f22" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M-56 -21L-50 -27L-45 -20Z" fill="#e7d9b8" stroke="#3f2f22" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="-59" cy="-8" r="4.5" fill="#f8f3e4" stroke="#3f2f22" stroke-width="1.5"/>
      <circle cx="-58" cy="-8" r="2.2" fill="#17301f"/>
      <circle cx="-10" cy="-6" r="3.6" fill="#c9652b" opacity=".85"/>
      <circle cx="12" cy="4" r="3" fill="#c9652b" opacity=".8"/>
      <circle cx="26" cy="-7" r="2.6" fill="#c9652b" opacity=".75"/>
    </g>

    <!-- frame brackets -->
    <path d="M536 278L536 226L588 226" stroke="#17301f" stroke-width="3" fill="none"/>
    <path d="M1012 226L1064 226L1064 278" stroke="#17301f" stroke-width="3" fill="none"/>
    <path d="M536 662L536 714L588 714" stroke="#17301f" stroke-width="3" fill="none"/>
    <path d="M1012 714L1064 714L1064 662" stroke="#17301f" stroke-width="3" fill="none"/>

    <text x="600" y="214" class="mono" font-size="15" letter-spacing="2" fill="#5e7a3a">CRERIUM · VIVARIUM-01</text>
    <circle cx="988" cy="735" r="4" fill="#c9652b"/>
    <text x="1000" y="740" text-anchor="end" class="serif" font-size="16" font-style="italic" fill="#17301f">Correlophus ciliatus</text>
  </g>

  <!-- title block -->
  <g>
    <text x="90" y="108" class="mono" font-size="16" letter-spacing="3" fill="rgba(224,230,214,.65)">VIVARIUM · CRESTED GECKO BRAND SITE</text>
    <line x1="90" y1="130" x2="170" y2="130" stroke="#c9652b" stroke-width="3"/>
    <text x="86" y="204" class="serif" font-size="92" font-weight="700" fill="#f3efe3">크레리움</text>
    <text x="90" y="252" class="serif" font-size="28" font-style="italic" fill="#afc79a">작은 자연을, 가까이.</text>
  </g>

  <!-- service chips -->
  <g class="sans">
    <g transform="translate(90,756)">
      <rect width="210" height="84" rx="16" fill="#f8f9f3" stroke="#17301f" stroke-opacity=".15"/>
      <circle cx="34" cy="42" r="22" fill="#5e7a3a" opacity=".15"/>
      <path d="M20 44L34 30L48 44M24 44H44V54H24Z" stroke="#17301f" stroke-width="2" fill="none"/>
      <text x="68" y="38" font-size="20" font-weight="600" fill="#17301f">호텔 투어</text>
      <text x="68" y="60" font-size="13" fill="#5e7a3a">1F→RF 엘리베이터</text>
    </g>
    <g transform="translate(330,756)">
      <rect width="210" height="84" rx="16" fill="#f8f9f3" stroke="#17301f" stroke-opacity=".15"/>
      <circle cx="34" cy="42" r="22" fill="#5e7a3a" opacity=".15"/>
      <rect x="20" y="34" width="28" height="20" rx="3" stroke="#17301f" stroke-width="2" fill="none"/>
      <rect x="28" y="29" width="10" height="6" stroke="#17301f" stroke-width="2" fill="none"/>
      <circle cx="34" cy="44" r="6" stroke="#17301f" stroke-width="2" fill="none"/>
      <text x="68" y="38" font-size="20" font-weight="600" fill="#17301f">사진관</text>
      <text x="68" y="60" font-size="13" fill="#5e7a3a">증명사진 3장</text>
    </g>
    <g transform="translate(570,756)">
      <rect width="210" height="84" rx="16" fill="#f8f9f3" stroke="#17301f" stroke-opacity=".15"/>
      <circle cx="34" cy="42" r="22" fill="#5e7a3a" opacity=".15"/>
      <use href="#leaf" transform="translate(16,56) scale(.55)" color="#5e7a3a"/>
      <text x="68" y="38" font-size="20" font-weight="600" fill="#17301f">판매</text>
      <text x="68" y="60" font-size="13" fill="#5e7a3a">생체·용품·먹이</text>
    </g>
  </g>

  <!-- browser chrome -->
  <g>
    <rect x="0" y="0" width="1600" height="48" fill="#0b1b12"/>
    <circle cx="28" cy="24" r="7" fill="#c97b6a"/>
    <circle cx="52" cy="24" r="7" fill="#d9b36b"/>
    <circle cx="76" cy="24" r="7" fill="#7fa878"/>
    <rect x="640" y="10" width="320" height="28" rx="14" fill="#132a1b" stroke="#2d5a37"/>
    <text x="800" y="29" text-anchor="middle" class="mono" font-size="15" fill="#bcd1b6">crerium.r-e.kr</text>
  </g>

  <text x="1560" y="876" text-anchor="end" class="mono" font-size="13" font-style="italic" fill="#5e7a3a" opacity=".75">Concept visual · 실제 화면 캡처 아님</text>
</svg>
