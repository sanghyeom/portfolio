<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized SCADA monitoring concept</title>
  <desc id="desc">A synthetic dashboard concept for an industrial monitoring system using demo labels and fictional data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081326"/>
      <stop offset="0.48" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213e"/>
      <stop offset="1" stop-color="#0b1429"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg{fill:url(#bg)}
      .panel{fill:url(#panel);stroke:#23395f;stroke-width:1.5}
      .muted{fill:#92a5cc}
      .text{fill:#eef5ff;font-family:Inter,Arial,sans-serif}
      .small{font-size:17px}
      .label{font-size:19px;font-weight:600}
      .title{font-size:28px;font-weight:700}
      .value{font-size:40px;font-weight:800}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .grid{stroke:#223555;stroke-width:1;opacity:.55}
      .cyan{stroke:#22d3ee}
      .blue{stroke:#3b82f6}
      .green{stroke:#22c55e}
      .amber{stroke:#f59e0b}
      .red{stroke:#ef4444}
      .purple{stroke:#8b5cf6}
    </style>
  </defs>

